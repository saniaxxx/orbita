[workspace]
members = [
    "crates/orbita-core",
    "crates/orbita-mcp-search",
    "crates/orbita-tts",
    "crates/orbita-processor",
    "crates/orbita-asr",
    "crates/orbita-proto",
    "crates/orbita-quasar",
    "crates/orbita-station-sim",
    "crates/orbita-dashboard",
    "crates/orbita-cli",
    "crates/orbita-glagol",
    "crates/orbita-home",
    "crates/orbita-agent",
    "crates/orbita-tv",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
handlebars = "6.4"
mdns-sd = "0.13"
native-tls = "0.2"
prost = "0.13"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rumqttc = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rmcp = { version = "3.8", features = ["transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# ONNX Runtime bindings for the ASR engine. CPU builds download ONNX Runtime;
# GPU hosts use `load-dynamic` + `ORT_DYLIB_PATH` to the onnxruntime-gpu build.
[workspace.dependencies.ort]
version = "=2.0.0-rc.10"

[workspace.dependencies.flate2]
version = "1.1"

[workspace.dependencies.rustfft]
version = "6.2"

[workspace.dependencies.tower]
version = "0.5"
features = ["util"]

[workspace.dependencies.http-body-util]
version = "0.1"

[workspace.dependencies.tokio-tungstenite]
version = "0.29"

[workspace.dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
