[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbita"
version = "0.1.0"
description = "Voice server for ESPHome voice satellites (pulsar on Yandex Stations, linux-voice-assistant) without Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioesphomeapi==46.22.0",
    "aiohttp>=3.9,<4",
    "pymicro-vad>=2.1,<3",
    "aiomqtt>=2.3,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
orbita = "orbita.__main__:main"

[tool.setuptools]
packages = ["orbita"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
