[package]
name = "orbita-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Speech synthesis (Vosk TTS on ONNX Runtime), OpenAI-compatible HTTP API"

[[bin]]
name = "orbita-tts"
path = "src/main.rs"

[features]
default = ["vosk"]
# Vosk TTS ru 0.10 on ONNX Runtime (CPU execution provider).
vosk = ["dep:ort"]
# CUDA execution provider; pair with `load-dynamic` on the GPU host.
cuda = ["vosk", "ort/cuda"]
# Load libonnxruntime at run time from ORT_DYLIB_PATH instead of linking it.
load-dynamic = ["vosk", "ort/load-dynamic"]

[dependencies]
anyhow.workspace = true
flate2.workspace = true
axum.workspace = true
orbita-core = { path = "../orbita-core" }
ort = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
