# End-of-utterance fix for the quiet station microphone (deploy/asr/README.md).
# INPUT_GAIN=30 stays in qsg-asr.service; it is applied once in the streaming
# path. RECOGNIZE_GAIN=1 removes the second gain before GigaAM.
[Service]
Environment=RECOGNIZE_GAIN=1
Environment=VAD_ENERGY_GATE_RATIO=0.3
Environment=VAD_ENERGY_GATE_MAX_RMS=900
