[Service]
# Thinking off: Qwen3.5 with thinking spends the budget on `reasoning_content`
# and leaves `content` empty (D-21). Grammar is per request from the client;
# the global GBNF file was removed on 08.11.2026.
Environment=LLAMA_ARG_REASONING=off
ExecStart=
# Two slots (18.11.2026): with one slot a background agent run held the model
# for minutes and a voice turn waited in the queue (measured: 45 s timeout,
# then 10 s instead of 0.6 s). With two slots the background run keeps slot 0
# and the station answers on slot 1 in 0.9-3 s under the same load. `-c` is
# the total context, so each slot gets 16384 tokens; OpenClaw's model entry
# says contextWindow 16384 for the same reason.
ExecStart=/root/llama.cpp/build/bin/llama-server -m /models/qwen35/Qwen3.5-9B-Q4_K_M.gguf --alias qwen3.5-9b-q4km -ngl 99 -c 32768 -np 2 -fa on -ctk q8_0 -ctv q8_0 --jinja --host 0.0.0.0 --port 8090
