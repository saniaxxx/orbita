[Service]
# The processor reads only `delta.content` and always expects the answer to be
# a JSON object, while Qwen3.5 with thinking emits long `reasoning_content`
# (one request spent 72 s and 4588 tokens and hit the context limit with an
# empty content, which broke the JSON parse). Thinking is off, and a GBNF JSON
# grammar keeps the answer in the shape the processor can parse.
# `--json-schema` is not usable here: this llama.cpp build fails with
# "Failed to initialize samplers" when the schema is applied.
Environment=LLAMA_ARG_REASONING=off
ExecStart=
ExecStart=/root/llama.cpp/build/bin/llama-server -m /models/qwen35/Qwen3.5-9B-Q4_K_M.gguf --alias qwen3.5-9b-q4km -ngl 99 -c 32768 -np 1 -fa on -ctk q8_0 -ctv q8_0 --jinja --host 0.0.0.0 --port 8090 --grammar-file /etc/llama-json.gbnf
