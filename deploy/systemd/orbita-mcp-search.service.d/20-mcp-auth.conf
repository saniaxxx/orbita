# MCP over the private network with a token (spec §7). The core (OpenClaw on
# orbita-brain) connects to 192.168.250.103 with `Authorization: Bearer`;
# loopback callers on orbita-hub (legacy agent) stay trusted. MCP_TOKEN lives
# in /etc/orbita/mcp.env (0600), not in the repository.
[Service]
Environment=HOST=0.0.0.0
Environment=MCP_ALLOWED_HOSTS=192.168.250.103
EnvironmentFile=/etc/orbita/mcp.env
