[Service]
# Do not accept station connections until the local voice stack is ready.
# Vosk TTS loads CUDA kernels for ~30-90 s after boot; it lives in CT 100.
ExecStartPre=/usr/bin/curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://192.168.250.102:9170/health
ExecStartPre=/usr/bin/curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health
