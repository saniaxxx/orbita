[Service]
# Wait for the shared TTS and for the station adapter (D-22) before quasar
# starts. The legacy agent (127.0.0.1:8080) is stopped since 08.11.2026; waiting
# for it made every quasar restart hang and fail.
ExecStartPre=/usr/bin/curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://192.168.250.102:9170/health
ExecStartPre=/usr/bin/curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://192.168.250.105:8081/health
