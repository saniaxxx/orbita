worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

stream {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    resolver_timeout 5s;

    # Missing SNI, IP literals and malformed names are not origin destinations.
    map $ssl_preread_server_name $origin_tls {
        default 127.0.0.1:1;
        "~*^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$" $ssl_preread_server_name:443;
    }
    map $ssl_preread_server_name $tls_backend {
        hostnames;
        default $origin_tls;
        include /app/generated/stream/*.conf;
    }
    log_format tls_connection '[$time_local] $remote_addr '
                              '"TLS $ssl_preread_server_name" $status '
                              'upstream=$upstream_addr bytes_sent=$bytes_sent '
                              'bytes_received=$bytes_received duration=$session_time';
    access_log /dev/stdout tls_connection;

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    log_format request_url '[$time_local] $remote_addr '
                           '"$request_method $scheme://$host$request_uri" $status';
    access_log /dev/stdout request_url;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;
        location / {
            proxy_pass http://$host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # This listener is reachable only by the stream router in this container.
    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 421;
    }

    include /app/generated/configs/*.conf;
}
